<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보고서 도표</title>
<style>
  /* 글꼴은 보고서 본문과 같은 Freesentation. 설치된 글꼴이 있으면 그것을, 없으면 이 스킬의 fonts/ 를 읽는다 */
  @font-face { font-family: "Rep"; font-weight: 400; src: local("Freesentation 4 Regular"), local("Freesentation-4Regular"), url("../fonts/FREESENTATION-4REGULAR.TTF"); }
  @font-face { font-family: "Rep"; font-weight: 500; src: local("Freesentation 5 Medium"), local("Freesentation-5Medium"), url("../fonts/FREESENTATION-5MEDIUM.TTF"); }
  @font-face { font-family: "Rep"; font-weight: 700; src: local("Freesentation 7 Bold"), local("Freesentation-7Bold"), url("../fonts/FREESENTATION-7BOLD.TTF"); }

  /* 도표 문법: 흰 바탕, 테두리와 둥근 모서리와 그림자 없음, 주황과 회색, 막대마다 값, 아래쪽 범례 (rules/3-exhibits.md) */
  :root { --ink: #2d2d2d; --ink-2: #555a63; --axis: #ccd0d5; --grid: #e5e7ea; --band: #eeeef1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: "Rep", "Apple SD Gothic Neo", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; padding: 20px; }
  .fig { background: #fff; padding: 6px 0 4px; margin-bottom: 28px; }
  .fig svg { display: block; }
  .fig svg.plot { width: 100%; height: auto; }
  .tick { font-size: 12.5px; fill: var(--ink-2); }
  .val { font-size: 12.5px; font-weight: 500; fill: var(--ink); }
  .subtitle { font-size: 13.5px; margin: 2px 0 6px; }
  .band { background: var(--band); text-align: center; font-weight: 700; font-size: 13px; padding: 5px 0; margin: 14px 0 6px; }
  .band:first-child { margin-top: 0; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; margin-top: 8px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; flex: none; }
  .legend i.line { width: 24px; height: 2px; position: relative; }
  .legend i.line::after { content: ""; position: absolute; left: 8px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: inherit; }
  .donut-row { display: flex; align-items: center; gap: 30px; }
  .donut-legend { display: grid; grid-auto-flow: column; gap: 9px 30px; font-size: 13px; }
  .donut-legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .donut-legend i { width: 10px; height: 10px; flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
/* SPEC 은 render.mjs 가 JSON 파일을 읽어 넣는다. 형식은 rules/3-exhibits.md */
const SPEC = window.SPEC;
const W = SPEC.width || 680;                       // 본문 폭 170mm 에 넣는 기준 폭(CSS px)
/* 색은 설정 파일 맨 위 "colors" 로 바꿀 수 있다: { "series": [...], "stack": [...], "donut": [...] } */
const COLORS = SPEC.colors || {};
const PALETTE = COLORS.series || ["#dc5218", "#eaa974", "#f2cca8", "#ccd0d5", "#a2a7b1"];        // 묶은 막대, 가로 막대, 꺾은선
const STACK = COLORS.stack || ["#dc5218", "#eaa974", "#7b808a", "#ccd0d5", "#f2cca8"];           // 쌓은 막대(이웃 색 구분 검증 통과 순서)
const DONUT = COLORS.donut || ["#dc5218", "#e27b40", "#eaa974", "#f2cca8", "#f9e7d4", "#ccd0d5", "#b6bbc2", "#a2a7b1"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, c) => Number(v).toLocaleString(SPEC.locale || "ko-KR") + (c.valueSuffix || "");

/* 눈금: 최댓값을 덮는 깔끔한 간격(1, 2, 2.5, 5 의 10배수) */
function niceScale(max, target = 6) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const raw = max / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= raw);
  const top = Math.ceil((max * 1.02) / step) * step;
  const ticks = [];
  for (let t = 0; t <= top + step / 1e6; t += step) ticks.push(+t.toFixed(10));
  return { max: top, ticks };
}
/* 눈금 글자 폭에 맞춰 왼쪽 여백을 정한다(네 자리 숫자도 잘리지 않게). 글꼴을 읽은 뒤에 그리므로 실제 폭과 같다 */
const ctx2d = document.createElement("canvas").getContext("2d");
const textW = (s) => { ctx2d.font = '400 12.5px "Rep", "Apple SD Gothic Neo", sans-serif'; return ctx2d.measureText(String(s)).width; };
const leftFor = (c, sc) => Math.max(34, Math.ceil(Math.max(...sc.ticks.map((t) => textW(fmt(t, c))))) + 14);
const scaleOf = (c, dataMax, key) => (c[key + "Ticks"] ? { max: c[key + "Max"] ?? c[key + "Ticks"].at(-1), ticks: c[key + "Ticks"] } : niceScale(c[key + "Max"] || dataMax));
const seriesColors = (c, series) => series.map((s, i) => { const pal = c.type === "column" && c.stacked ? STACK : PALETTE; return s.color || pal[i % pal.length]; });
/* 계열 하나 안에서 막대마다 색을 바꿀 때(비교 기준 막대만 회색 등). 묶은 막대와 가로 막대만 */
const pointColor = (s, i, fallback) => (s.pointColors && s.pointColors[i]) || fallback;

/* 세로 막대. stacked 면 쌓고 합계를 적는다. 아니면 묶어서 막대마다 값을 적는다(묶음 안 막대는 붙여 그린다) */
function columnSvg(c, d, colors, dataMax) {
  const H = c.height || 290;
  const lines = Math.max(...d.categories.map((x) => String(x).split("\n").length));
  const sc = scaleOf(c, dataMax, "y");
  const m = { top: 22, right: 6, bottom: 12 + 16 * lines, left: leftFor(c, sc) };
  const pw = W - m.left - m.right, ph = H - m.top - m.bottom, n = d.series.length, band = pw / d.categories.length;
  const y = (v) => m.top + ph - (v / sc.max) * ph;
  let g = "";
  for (const t of sc.ticks) g += `<text class="tick" x="${m.left - 9}" y="${y(t) + 4}" text-anchor="end">${fmt(t, c)}</text>`;
  d.categories.forEach((cat, i) => {
    const cx = m.left + band * i + band / 2;
    if (c.stacked) {
      const bw = Math.min(c.barWidth || 20, band * 0.66), x = cx - bw / 2;
      const segs = d.series.map((s, j) => ({ v: s.values[i] || 0, col: colors[j] })).filter((s) => s.v > 0);
      let acc = 0;
      segs.forEach((s, j) => {
        const y0 = y(acc), y1 = y(acc + s.v);
        acc += s.v;
        const sep = j === segs.length - 1 ? 0 : 1;          // 구간 사이는 흰 선 1px
        g += `<rect x="${x}" y="${y1 + sep}" width="${bw}" height="${Math.max(y0 - y1 - sep, 0.8)}" fill="${s.col}"/>`;
      });
      if (c.totalLabels !== false) g += `<text class="val" x="${cx}" y="${y(acc) - 5}" text-anchor="middle">${fmt(acc, c)}</text>`;
    } else {
      const gw = Math.min(band * 0.74, n * (c.barWidth || 24)), bw = gw / n, x0 = cx - gw / 2;
      d.series.forEach((s, j) => {
        const v = s.values[i];
        if (v == null) return;
        g += `<rect x="${x0 + bw * j}" y="${y(v)}" width="${bw}" height="${Math.max(y(0) - y(v), 0)}" fill="${pointColor(s, i, colors[j])}"/>`;
        if (c.valueLabels !== false) g += `<text class="val" x="${x0 + bw * j + bw / 2}" y="${y(v) - 5}" text-anchor="middle">${fmt(v, c)}</text>`;
      });
    }
    String(cat).split("\n").forEach((ln, li) => {
      g += `<text class="tick" x="${cx}" y="${m.top + ph + 21 + li * 16}" text-anchor="middle">${esc(ln)}</text>`;
    });
  });
  g += `<line x1="${m.left}" x2="${W - m.right}" y1="${y(0) + 0.5}" y2="${y(0) + 0.5}" stroke="#ccd0d5" stroke-width="1"/>`;
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* 가로 막대(묶음). 항목 이름이 길거나 항목 수가 많을 때 */
function barSvg(c, d, colors, dataMax) {
  const n = d.series.length, k = d.categories.length;
  const rowH = c.rowHeight || Math.max(46, n * 19 + 24);
  const m = { top: 6, right: 46, bottom: 30, left: c.labelWidth || 120 };
  const H = m.top + m.bottom + rowH * k, pw = W - m.left - m.right;
  const sc = scaleOf(c, dataMax, "x");
  const x = (v) => m.left + (v / sc.max) * pw;
  let g = "";
  d.categories.forEach((cat, i) => {
    const cy = m.top + rowH * i + rowH / 2, gh = Math.min(rowH * 0.74, n * (c.barWidth || 19)), bh = gh / n, y0 = cy - gh / 2;
    d.series.forEach((s, j) => {
      const v = s.values[i];
      if (v == null) return;
      g += `<rect x="${m.left}" y="${y0 + bh * j}" width="${Math.max(x(v) - m.left, 0)}" height="${bh}" fill="${pointColor(s, i, colors[j])}"/>`;
      if (c.valueLabels !== false) g += `<text class="val" x="${x(v) + 6}" y="${y0 + bh * j + bh / 2 + 4.5}">${fmt(v, c)}</text>`;
    });
    g += `<text class="tick" x="${m.left - 14}" y="${cy + 4.5}" text-anchor="end">${esc(cat)}</text>`;
  });
  const by = m.top + rowH * k;
  for (const t of sc.ticks) g += `<text class="tick" x="${x(t)}" y="${by + 20}" text-anchor="middle">${fmt(t, c)}</text>`;
  g += `<line x1="${m.left + 0.5}" x2="${m.left + 0.5}" y1="${m.top}" y2="${by}" stroke="#ccd0d5" stroke-width="1"/>`;
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* 꺾은선. 가로 눈금선을 옅게 둔다. 먼저 적은 계열이 맨 위에 그려진다 */
function lineSvg(c, d, colors, dataMax) {
  const H = c.height || 300, k = d.categories.length;
  const sc = scaleOf(c, dataMax, "y");
  const m = { top: 14, right: 10, bottom: 30, left: leftFor(c, sc) };
  const pw = W - m.left - m.right, ph = H - m.top - m.bottom;
  const y = (v) => m.top + ph - (v / sc.max) * ph, x = (i) => m.left + (pw * (i + 0.5)) / k;
  let g = "";
  for (const t of sc.ticks) {
    g += `<line x1="${m.left}" x2="${W - m.right}" y1="${y(t) + 0.5}" y2="${y(t) + 0.5}" stroke="${t === 0 ? "#ccd0d5" : "#e5e7ea"}" stroke-width="1"/>`;
    g += `<text class="tick" x="${m.left - 9}" y="${y(t) + 4}" text-anchor="end">${fmt(t, c)}</text>`;
  }
  d.categories.forEach((cat, i) => { g += `<text class="tick" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(cat)}</text>`; });
  [...d.series.keys()].reverse().forEach((j) => {
    const pts = d.series[j].values.map((v, i) => (v == null ? null : [x(i), y(v), v])).filter(Boolean);
    g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0] + "," + p[1]).join(" ")}" fill="none" stroke="${colors[j]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (const p of pts) g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${colors[j]}"/>`;
    if (c.valueLabels) for (const p of pts) g += `<text class="val" x="${p[0]}" y="${p[1] - 9}" text-anchor="middle">${fmt(p[2], c)}</text>`;
  });
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* 도넛. 조각 사이는 흰 선, 비율은 조각 안에(5% 미만은 바깥에 짧은 선과 함께). 범례는 오른쪽 */
function donutHtml(c) {
  const size = c.size || 190, pad = 34, S = size + pad * 2, R = size / 2, r = R * 0.55, cx = S / 2, cy = S / 2;
  const total = c.slices.reduce((s, x) => s + x.value, 0);
  const pt = (rad, a) => [cx + rad * Math.sin(a), cy - rad * Math.cos(a)];
  let a0 = 0, g = "";
  c.slices.forEach((s, i) => {
    const frac = s.value / total, a1 = a0 + frac * Math.PI * 2, large = frac > 0.5 ? 1 : 0, col = s.color || DONUT[i % DONUT.length];
    const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r, a1), [x3, y3] = pt(r, a0);
    g += `<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    const mid = (a0 + a1) / 2, pct = Math.round(frac * 100) + "%";
    if (frac >= 0.05) {
      const [lx, ly] = pt((R + r) / 2, mid);
      g += `<text class="val" x="${lx}" y="${ly + 4.5}" text-anchor="middle">${pct}</text>`;
    } else {
      const [ax, ay] = pt(R + 2, mid), [bx, by] = pt(R + 10, mid), [lx, ly] = pt(R + 21, mid);
      g += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#2d2d2d" stroke-width="1"/><text class="val" x="${lx}" y="${ly + 4.5}" text-anchor="middle">${pct}</text>`;
    }
    a0 = a1;
  });
  const rows = c.slices.length > 4 ? Math.ceil(c.slices.length / 2) : c.slices.length;
  const legend = c.slices.map((s, i) => `<span><i style="background:${s.color || DONUT[i % DONUT.length]}"></i>${esc(s.name)}</span>`).join("");
  return `<div class="donut-row"><svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}" role="img">${g}</svg>
    <div class="donut-legend" style="grid-template-rows: repeat(${rows}, auto)">${legend}</div></div>`;
}

const PLOT = { column: columnSvg, bar: barSvg, line: lineSvg };
const peak = (c, d) => Math.max(...d.categories.map((_, i) =>
  c.type === "column" && c.stacked ? d.series.reduce((s, x) => s + (x.values[i] || 0), 0) : Math.max(...d.series.map((x) => x.values[i] ?? 0))));

function draw() {
for (const c of SPEC.charts) {
  const sec = document.createElement("section");
  sec.className = "fig";
  sec.id = c.id;
  sec.style.width = W + "px";
  let html = c.subtitle ? `<div class="subtitle">${esc(c.subtitle)}</div>` : "";
  if (c.type === "donut") {
    html += donutHtml(c);
  } else {
    /* panels 가 있으면 소제목 띠를 단 작은 도표 여러 개. 눈금은 서로 비교되게 같은 최댓값을 쓴다 */
    const panels = (c.panels || [c]).map((p) => ({ title: p.title, categories: p.categories || c.categories, series: p.series }));
    const dataMax = Math.max(...panels.map((d) => peak(c, d)));
    for (const d of panels) {
      const colors = seriesColors(c, d.series);
      if (d.title) html += `<div class="band">${esc(d.title)}</div>`;
      html += PLOT[c.type](c, d, colors, dataMax);
      if (c.legend !== false && d.series.length > 1) {
        html += `<div class="legend">` + d.series.map((s, j) =>
          `<span><i class="${c.type === "line" ? "line" : ""}" style="background:${colors[j]}"></i>${esc(s.name)}</span>`).join("") + `</div>`;
      }
    }
  }
  sec.innerHTML = html;
  document.getElementById("root").appendChild(sec);
}
}

/* 글꼴을 읽은 뒤에 그린다. render.mjs 는 CHARTS_READY 를 기다렸다가 찍는다 */
Promise.all(["400", "500", "700"].map((w) => document.fonts.load(`${w} 13px "Rep"`)))
  .catch(() => {})
  .then(() => { draw(); window.CHARTS_READY = true; })
  .catch((e) => { window.CHARTS_ERROR = String(e && e.stack || e); });
</script>
</body>
</html>
