name: Improvement
description: A better rule, a new chart type, or a doc that no longer matches the tools.
title: "[Improvement] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Leave out client names, real report numbers, screenshots of private pages and secrets.
  - type: textarea
    id: now
    attributes:
      label: Current rule or behavior
      description: Which file and section, and what it says or does today.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: A real case you ran into helps most. Describe it with made-up data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Check
      options:
        - label: I removed client names, real numbers, private screenshots and secrets
          required: true
